  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black:#111; --white:#fff; --bg:#f5f4f0; --card:#fff; --border:#dddbd4; --mid:#888; --red:#c0392b; --green:#1a6b35; }
    html,body,#root { height:100%; }
    body { background:var(--bg); font-family:'Barlow',sans-serif; color:var(--black); -webkit-font-smoothing:antialiased; }

    /* LOGIN */
    .login-wrap { min-height:100vh; display:flex; flex-direction:column; }
    .login-head { background:var(--black); padding:20px 24px; display:flex; align-items:center; }
    .login-head img { height:36px; filter:invert(1); }
    .login-body { flex:1; display:flex; align-items:center; justify-content:center; padding:32px 20px; }
    .login-card { background:var(--card); border:1.5px solid var(--border); border-radius:4px; padding:32px 28px; width:100%; max-width:380px; }
    .login-title { font-family:'Barlow Condensed',sans-serif; font-size:1.6rem; font-weight:800; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
    .login-sub { font-size:.85rem; color:var(--mid); margin-bottom:28px; }
    .login-err { background:#fdf0ee; border:1.5px solid var(--red); border-radius:3px; padding:10px 14px; font-size:.83rem; color:var(--red); margin-bottom:16px; }
    .login-switch { margin-top:20px; text-align:center; font-size:.82rem; color:var(--mid); }
    .login-switch button { background:none; border:none; color:var(--black); font-weight:600; font-family:'Barlow',sans-serif; cursor:pointer; text-decoration:underline; font-size:.82rem; }

    /* NAV */
    .nav { background:var(--black); padding:0 20px; display:flex; align-items:stretch; position:sticky; top:0; z-index:100; }
    .nav-logo { display:flex; align-items:center; padding:10px 0; margin-right:auto; }
    .nav-logo img { height:32px; filter:invert(1); }
    .nav-tabs { display:flex; }
    .nav-tab { background:none; border:none; color:rgba(255,255,255,.5); font-family:'Barlow Condensed',sans-serif; font-size:.8rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:0 14px; cursor:pointer; transition:color .2s; border-bottom:3px solid transparent; }
    .nav-tab:hover { color:rgba(255,255,255,.8); }
    .nav-tab.active { color:#fff; border-bottom-color:#fff; }

    /* LAYOUT */
    .main { max-width:580px; margin:0 auto; padding:28px 18px 80px; }
    .page-title { font-family:'Barlow Condensed',sans-serif; font-size:1.9rem; font-weight:800; letter-spacing:1px; text-transform:uppercase; margin-bottom:24px; }

    /* LOADING */
    .loading-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--black); }
    .loading-screen img { height:48px; filter:invert(1); opacity:.6; animation:pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }
    .loading-data { padding:60px 20px; text-align:center; color:var(--mid); font-size:.88rem; }

    /* CARDS */
    .card { background:var(--card); border:1.5px solid var(--border); border-radius:4px; padding:22px; margin-bottom:10px; }
    .card-title { font-family:'Barlow Condensed',sans-serif; font-size:.68rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--mid); margin-bottom:16px; }

    /* FIELDS */
    .field { display:flex; flex-direction:column; gap:5px; }
    .field+.field { margin-top:13px; }
    label { font-family:'Barlow Condensed',sans-serif; font-size:.65rem; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:var(--mid); }
    input,textarea,select { font-family:'Barlow',sans-serif; font-size:.93rem; font-weight:500; color:var(--black); background:var(--bg); border:1.5px solid var(--border); border-radius:3px; padding:10px 12px; width:100%; transition:border-color .15s; outline:none; -webkit-appearance:none; appearance:none; }
    input:focus,textarea:focus,select:focus { border-color:var(--black); background:#fff; }
    textarea { min-height:58px; resize:vertical; }

    /* TIPO */
    .tipo-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .tipo-btn { padding:10px; border:1.5px solid var(--border); border-radius:3px; background:var(--bg); font-family:'Barlow Condensed',sans-serif; font-size:.8rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--mid); cursor:pointer; transition:all .15s; }
    .tipo-btn.active { border-color:var(--black); background:var(--black); color:#fff; }

    /* IMPORTO */
    .importo-row { display:grid; grid-template-columns:1fr 110px; gap:12px; align-items:end; }
    .calc-box { margin-top:16px; border-top:1.5px solid var(--border); padding-top:14px; }
    .calc-line { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; font-size:.9rem; }
    .calc-line .lbl { color:var(--mid); }
    .calc-line .val { font-weight:600; }
    .calc-line.netto { border-top:1px solid var(--border); padding-top:11px; margin-top:4px; }
    .calc-line.netto .lbl { font-weight:700; color:var(--black); font-size:.88rem; }
    .calc-line.netto .val { color:var(--green); font-weight:800; font-size:1.1rem; }
    .ritenuta-val { color:var(--red); }

    /* NUMERO */
    .numero-row { display:flex; align-items:center; gap:10px; }
    .numero-display { font-family:'Barlow Condensed',sans-serif; font-size:1.5rem; font-weight:800; }
    .numero-edit { font-size:.75rem; color:var(--mid); cursor:pointer; text-decoration:underline; font-family:'Barlow',sans-serif; background:none; border:none; padding:0; }

    /* BUTTONS */
    .btn-primary { width:100%; padding:15px; background:var(--black); color:#fff; font-family:'Barlow Condensed',sans-serif; font-size:1rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; border:none; border-radius:3px; cursor:pointer; transition:opacity .15s; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; }
    .btn-primary:hover:not(:disabled) { opacity:.82; }
    .btn-primary:disabled { opacity:.35; cursor:not-allowed; }
    .btn-secondary { padding:8px 14px; background:transparent; border:1.5px solid var(--black); color:var(--black); font-family:'Barlow Condensed',sans-serif; font-size:.78rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; border-radius:3px; cursor:pointer; transition:all .15s; }
    .btn-secondary:hover { background:var(--black); color:#fff; }
    .btn-ghost { padding:8px 14px; background:transparent; border:1.5px solid var(--border); color:var(--mid); font-family:'Barlow Condensed',sans-serif; font-size:.78rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; border-radius:3px; cursor:pointer; transition:all .15s; }
    .btn-ghost:hover { border-color:var(--red); color:var(--red); }
    .btn-danger { padding:8px 14px; background:transparent; border:1.5px solid var(--red); color:var(--red); font-family:'Barlow Condensed',sans-serif; font-size:.78rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; border-radius:3px; cursor:pointer; transition:all .15s; }
    .btn-danger:hover { background:var(--red); color:#fff; }

    /* STORICO */
    .storico-item { background:var(--card); border:1.5px solid var(--border); border-radius:4px; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .storico-item:hover { border-color:#aaa; }
    .storico-left .num { font-family:'Barlow Condensed',sans-serif; font-size:.75rem; font-weight:700; letter-spacing:2px; color:var(--mid); text-transform:uppercase; }
    .storico-left .cliente { font-size:.98rem; font-weight:600; margin:2px 0; }
    .storico-left .desc { font-size:.8rem; color:var(--mid); }
    .storico-right { text-align:right; flex-shrink:0; margin-left:12px; }
    .storico-right .netto { font-family:'Barlow Condensed',sans-serif; font-size:1.15rem; font-weight:800; }
    .storico-right .tag { font-size:.7rem; color:var(--mid); font-family:'Barlow Condensed',sans-serif; letter-spacing:1px; text-transform:uppercase; }
    .storico-right .actions { display:flex; gap:6px; margin-top:8px; justify-content:flex-end; }
    .storico-empty { text-align:center; padding:60px 20px; color:var(--mid); font-size:.92rem; }

    /* MISC */
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--black); color:#fff; padding:11px 26px; border-radius:3px; font-family:'Barlow Condensed',sans-serif; font-size:.88rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; transition:transform .35s cubic-bezier(.34,1.56,.64,1); z-index:999; white-space:nowrap; }
    .toast.show { transform:translateX(-50%) translateY(0); }
    .hint { font-size:.78rem; color:var(--mid); margin-top:10px; text-align:center; }
    .expand-btn { background:none; border:none; color:var(--mid); font-size:.78rem; cursor:pointer; text-decoration:underline; font-family:'Barlow',sans-serif; padding:0; margin-top:10px; }
    .install-steps { margin-top:12px; list-style:none; }
    .install-steps li { font-size:.86rem; color:var(--mid); padding:7px 0; border-bottom:1px solid var(--border); display:flex; gap:10px; line-height:1.5; }
    .install-steps li:last-child { border-bottom:none; }
    .install-steps .sn { font-family:'Barlow Condensed',sans-serif; font-weight:800; color:var(--black); min-width:18px; }
    .settings-badge { display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:.7rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; background:var(--green); color:#fff; padding:3px 10px; border-radius:3px; margin-left:10px; vertical-align:middle; }
    .logout-row { display:flex; justify-content:flex-end; margin-top:16px; }
    .user-email { font-size:.8rem; color:var(--mid); margin-bottom:16px; }

    @media (max-width:480px) {
      .importo-row { grid-template-columns:1fr; }
      .page-title { font-size:1.55rem; }
      .storico-item { flex-direction:column; align-items:flex-start; gap:10px; }
      .storico-right { width:100%; display:flex; justify-content:space-between; align-items:center; margin-left:0; }
      .storico-right .actions { margin-top:0; }
      .login-card { padding:28px 20px; }
    }
  </style>
</head>

  clienteNome: r.cliente_nome, clienteIndirizzo: r.cliente_indirizzo, clienteCF: r.cliente_cf,
  descrizione: r.descrizione, importoLordo: parseFloat(r.importo_lordo),
  aliquotaRitenuta: parseFloat(r.aliquota_ritenuta), note: r.note, tipo: r.tipo,
  prestatoreNome: r.prestatore_nome, prestatoreIndirizzo: r.prestatore_indirizzo,
  prestatoreCF: r.prestatore_cf, prestatorePIVA: r.prestatore_piva,
});

function makePDF(r) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const W=210, mg=20, cW=W-mg*2;
  try { doc.addImage(LOGO,'JPEG',mg,8,26,36); } catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(17,17,17);
  doc.text('RICEVUTA', W-mg, 16, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(130,130,130);
  doc.text("con ritenuta d'acconto", W-mg, 22, {align:'right'});
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(17,17,17);
  doc.text('N\u00b0 '+String(r.numero).padStart(3,'0')+' / '+r.anno, W-mg, 30, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(130,130,130);
  doc.text('Data: '+r.data, W-mg, 37, {align:'right'});
  doc.setDrawColor(200,200,195); doc.line(mg,50,W-mg,50);
  let y=58;
  const box=(label,lines,x,yy,w,h)=>{
    doc.setFillColor(245,244,240); doc.setDrawColor(220,218,211); doc.rect(x,yy,w,h,'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(136,136,136);
    doc.text(label,x+6,yy+7); let ty=yy+14;
    lines.forEach((l,i)=>{
      if(!l) return;
      if(i===0){doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(17,17,17);}
      else{doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(100,100,100);}
      const wr=doc.splitTextToSize(l,w-12); doc.text(wr,x+6,ty);
      ty+=(i===0?8:5.5)*wr.length;
    });
  };
  const hw=(cW-8)/2;
  box('PRESTATORE',[r.prestatoreNome,r.prestatoreIndirizzo,r.prestatoreCF?'C.F.: '+r.prestatoreCF:'',r.prestatorePIVA?'P.IVA: '+r.prestatorePIVA:''],mg,y,hw,46);
  box('COMMITTENTE',[r.clienteNome,r.clienteIndirizzo,r.clienteCF?'C.F./P.IVA: '+r.clienteCF:''],mg+hw+8,y,hw,46);
  y+=56;
  doc.setFillColor(245,244,240); doc.setDrawColor(220,218,211); doc.rect(mg,y,cW,26,'FD');
  doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(136,136,136);
  doc.text('DESCRIZIONE DELLA PRESTAZIONE',mg+6,y+7);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(17,17,17);
  doc.text(doc.splitTextToSize(r.descrizione||'—',cW-14),mg+6,y+15); y+=36;
  const lordo=r.importoLordo, rit=lordo*(r.aliquotaRitenuta/100), netto=lordo-rit;
  doc.setFillColor(245,244,240); doc.setDrawColor(220,218,211); doc.rect(mg,y,cW,52,'FD');
  const rx=mg+cW-6, lx=mg+6;
  const row=(l,v,yy,c)=>{
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.setTextColor(130,130,130); doc.text(l,lx,yy);
    doc.setTextColor(...(c||[17,17,17])); doc.text(v,rx,yy,{align:'right'});
  };
  row('Importo lordo della prestazione','€ '+fmt(lordo),y+12);
  if(r.aliquotaRitenuta>0) row("Ritenuta d'acconto ("+r.aliquotaRitenuta+'%)','- € '+fmt(rit),y+23,[192,57,43]);
  doc.setDrawColor(200,200,195); doc.line(lx,y+28,rx,y+28);
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.setTextColor(130,130,130); doc.text('Netto a pagare',lx,y+38);
  doc.setTextColor(26,107,53); doc.text('€ '+fmt(netto),rx,y+38,{align:'right'});
  if(r.aliquotaRitenuta>0){
    doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(150,150,150);
    doc.text("A titolo di acconto \u2014 art. 25 DPR 600/73",lx,y+47);
  }
  y+=62;
  if(r.note){
    doc.setFillColor(245,244,240); doc.setDrawColor(220,218,211); doc.rect(mg,y,cW,20,'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(136,136,136);
    doc.text('NOTE',mg+6,y+7);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(100,100,100);
    doc.text(doc.splitTextToSize(r.note,cW-12),mg+6,y+14); y+=28;
  }
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(150,150,150);
  doc.text('Operazione non soggetta a marca da bollo.',mg,y+8);
  doc.setDrawColor(200,200,195); doc.line(mg+cW-70,258,mg+cW,258);
  doc.text('Firma del Prestatore',mg+cW-35,263,{align:'center'});
  doc.setFillColor(245,244,240); doc.rect(0,282,W,15,'F');
  doc.setFontSize(7); doc.setTextColor(160,155,145);
  doc.text('Ricevuta N\u00b0 '+String(r.numero).padStart(3,'0')+'/'+r.anno+' \u2014 '+r.prestatoreNome+' \u2014 SUGNU RAUSANA',W/2,290,{align:'center'});
  doc.save('Ricevuta_SR_'+String(r.numero).padStart(3,'0')+'_'+r.anno+'.pdf');
}

// ─── LOGIN VIEW ────────────────────────────────────────
function LoginView() {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [ok, setOk] = useState('');

  const handle = async () => {
    setErr(''); setOk(''); setLoading(true);
    try {
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) setErr(error.message === 'Invalid login credentials' ? 'Email o password errati.' : error.message);
      } else {
        const { error } = await sb.auth.signUp({ email, password: pass });
        if (error) setErr(error.message);
        else setOk('Controlla la tua email per confermare la registrazione.');
      }
    } catch(e) { setErr('Errore di connessione.'); }
    setLoading(false);
  };

  const onKey = e => { if(e.key==='Enter') handle(); };

  return (
    <div className="login-wrap">
      <div className="login-head">
        <img src={`data:image/jpeg;base64,${LOGO}`} alt="Sugnu Rausana" />
      </div>
      <div className="login-body">
        <div className="login-card">
          <div className="login-title">{mode==='login' ? 'Accedi' : 'Registrati'}</div>
          <div className="login-sub">
            {mode==='login' ? 'Bentornato — inserisci le tue credenziali.' : 'Crea il tuo account per iniziare.'}
          </div>
          {err && <div className="login-err">{err}</div>}
          {ok  && <div style={{background:'#edf7f1',border:'1.5px solid var(--green)',borderRadius:3,padding:'10px 14px',fontSize:'.83rem',color:'var(--green)',marginBottom:16}}>{ok}</div>}
          <div className="field">
            <label>Email</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={onKey} placeholder="mario@esempio.it" autoFocus />
          </div>
          <div className="field">
            <label>Password</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={onKey} placeholder="••••••••" />
          </div>
          <button className="btn-primary" onClick={handle} disabled={!email||!pass||loading} style={{marginTop:20}}>
            {loading ? 'Caricamento…' : mode==='login' ? 'Accedi →' : 'Registrati →'}
          </button>
          <div className="login-switch">
            {mode==='login'
              ? <span>Non hai un account? <button onClick={()=>{setMode('signup');setErr('');setOk('');}}>Registrati</button></span>
              : <span>Hai già un account? <button onClick={()=>{setMode('login');setErr('');setOk('');}}>Accedi</button></span>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── NUOVA VIEW ────────────────────────────────────────
function NuovaView({ prestatore, ricevute, onSaved, toast }) {
  const [tipo, setTipo] = useState('azienda');
  const [showExtra, setShowExtra] = useState(false);
  const [saving, setSaving] = useState(false);
  const nextNum = ricevute.length > 0 ? Math.max(...ricevute.map(r=>r.numero||0))+1 : 1;
  const [num, setNum] = useState(nextNum);
  const [form, setForm] = useState({
    data:today(), clienteNome:'', clienteIndirizzo:'', clienteCF:'',
    descrizione:'Vendita magliette personalizzate Sugnu Rausana',
    importoLordo:'', note:'',
  });

  useEffect(()=>{ setNum(nextNum); }, [ricevute.length]);

  const set = k => e => setForm(f=>({...f,[k]:e.target.value}));
  const aliquota = tipo==='privato' ? 0 : 20;
  const lordo = parseFloat(form.importoLordo.replace(',','.'))||0;
  const rit = lordo*aliquota/100;
  const netto = lordo-rit;
  const canGo = lordo>0 && form.clienteNome.trim() && !saving;

  const handleGen = async () => {
    if(!canGo) return;
    setSaving(true);
    try {
      const r = {
        id: Date.now().toString(), numero: num, anno: year(),
        data: form.data||today(),
        clienteNome: form.clienteNome.trim(),
        clienteIndirizzo: form.clienteIndirizzo.trim(),
        clienteCF: form.clienteCF.trim(),
        descrizione: form.descrizione,
        importoLordo: lordo, aliquotaRitenuta: aliquota,
        note: form.note.trim(), tipo,
        prestatoreNome: prestatore.nome, prestatoreIndirizzo: prestatore.indirizzo,
        prestatoreCF: prestatore.cf, prestatorePIVA: prestatore.piva,
      };
      const { data:{ session } } = await sb.auth.getSession();
      const { error } = await sb.from('ricevute').insert({
        id:r.id, user_id:session.user.id,
        numero:r.numero, anno:r.anno, data:r.data,
        cliente_nome:r.clienteNome, cliente_indirizzo:r.clienteIndirizzo, cliente_cf:r.clienteCF,
        descrizione:r.descrizione, importo_lordo:r.importoLordo,
        aliquota_ritenuta:r.aliquotaRitenuta, note:r.note, tipo:r.tipo,
        prestatore_nome:r.prestatoreNome, prestatore_indirizzo:r.prestatoreIndirizzo,
        prestatore_cf:r.prestatoreCF, prestatore_piva:r.prestatorePIVA,
      });
      if(error) throw error;
      makePDF(r); onSaved();
      toast('✓ PDF generato e salvato');
      setForm(f=>({...f,clienteNome:'',clienteIndirizzo:'',clienteCF:'',importoLordo:'',note:'',data:today()}));
    } catch(e){ toast('Errore: '+e.message); }
    setSaving(false);
  };

  return (
    <div>
      <div className="page-title">Nuova Ricevuta</div>
      <div className="card">
        <div className="card-title">Numero</div>
        <div className="numero-row">
          <span className="numero-display">#{String(num).padStart(3,'0')} / {year()}</span>
          <button className="numero-edit" onClick={()=>{
            const n=prompt('Numero ricevuta:',num);
            if(n&&!isNaN(n)) setNum(parseInt(n));
          }}>modifica</button>
        </div>
      </div>
      <div className="card">
        <div className="card-title">Chi paga?</div>
        <div className="tipo-row">
          <button className={'tipo-btn'+(tipo==='privato'?' active':'')} onClick={()=>setTipo('privato')}>👤 Privato · 0%</button>
          <button className={'tipo-btn'+(tipo==='azienda'?' active':'')} onClick={()=>setTipo('azienda')}>🏢 Azienda · 20%</button>
        </div>
        <div className="field">
          <label>Nome / Ragione Sociale *</label>
          <input value={form.clienteNome} onChange={set('clienteNome')} placeholder={tipo==='privato'?'Mario Rossi':'Azienda Srl'} />
        </div>
        {showExtra && <>
          <div className="field">
            <label>Indirizzo</label>
            <input value={form.clienteIndirizzo} onChange={set('clienteIndirizzo')} placeholder="Via Roma 1, 00100 Roma" />
          </div>
          {tipo==='azienda' && <div className="field">
            <label>P.IVA / C.F.</label>
            <input value={form.clienteCF} onChange={set('clienteCF')} placeholder="12345678901" />
          </div>}
        </>}
        <button className="expand-btn" onClick={()=>setShowExtra(x=>!x)}>
          {showExtra?'— meno':('+ '+(tipo==='privato'?'indirizzo':'indirizzo e P.IVA'))}
        </button>
      </div>
      <div className="card">
        <div className="card-title">Importo</div>
        <div className="importo-row">
          <div className="field">
            <label>Importo (€) *</label>
            <input value={form.importoLordo} onChange={set('importoLordo')} placeholder="500,00" inputMode="decimal" />
          </div>
          <div className="field">
            <label>Ritenuta</label>
            <input value={aliquota+'%'} readOnly style={{textAlign:'center',fontWeight:700}} />
          </div>
        </div>
        {lordo>0 && <div className="calc-box">
          <div className="calc-line"><span className="lbl">Importo lordo</span><span className="val">€ {fmt(lordo)}</span></div>
          {aliquota>0 && <div className="calc-line"><span className="lbl">Ritenuta ({aliquota}%)</span><span className="val ritenuta-val">− € {fmt(rit)}</span></div>}
          <div className="calc-line netto">
            <span className="lbl">{tipo==='privato'?'Da incassare':'Netto a ricevere'}</span>
            <span className="val">€ {fmt(netto)}</span>
          </div>
        </div>}
      </div>
      <div className="card">
        <div className="card-title">Dettagli (opzionali)</div>
        <div className="field"><label>Data</label><input value={form.data} onChange={set('data')} /></div>
        <div className="field"><label>Descrizione</label><textarea value={form.descrizione} onChange={set('descrizione')} /></div>
        <div className="field"><label>Note (IBAN, scadenza…)</label><textarea value={form.note} onChange={set('note')} placeholder="Pagamento entro 30 gg — IBAN IT..." style={{minHeight:46}} /></div>
      </div>
      <button className="btn-primary" onClick={handleGen} disabled={!canGo}>
        {saving?'Salvataggio…':'↓ Genera PDF'}
      </button>
      {!form.clienteNome && <p className="hint">Inserisci il nome del pagante per continuare</p>}
    </div>
  );
}

// ─── STORICO VIEW ──────────────────────────────────────
function StoricoView({ ricevute, onDelete, toast }) {
  const [deleting, setDeleting] = useState(null);

  const dl = r => { makePDF(r); toast('✓ PDF scaricato'); };
  const del = async r => {
    if(!confirm('Eliminare questa ricevuta dallo storico?')) return;
    setDeleting(r.id);
    const { error } = await sb.from('ricevute').delete().eq('id', r.id);
    if(error) toast('Errore: '+error.message);
    else { onDelete(); toast('Ricevuta eliminata'); }
    setDeleting(null);
  };

  return (
    <div>
      <div className="page-title">Storico</div>
      {ricevute.length===0
        ? <div className="storico-empty">Nessuna ricevuta ancora generata.</div>
        : ricevute.map(r=>{
          const n=r.importoLordo*(1-r.aliquotaRitenuta/100);
          return (
            <div key={r.id} className="storico-item">
              <div className="storico-left">
                <div className="num">#{String(r.numero).padStart(3,'0')}/{r.anno} · {r.data}</div>
                <div className="cliente">{r.clienteNome}</div>
                <div className="desc">{(r.descrizione||'').substring(0,55)}{(r.descrizione||'').length>55?'…':''}</div>
              </div>
              <div className="storico-right">
                <div className="netto">€ {fmt(n)}</div>
                <div className="tag">{r.tipo==='privato'?'privato':'azienda'}</div>
                <div className="actions">
                  <button className="btn-secondary" onClick={()=>dl(r)}>PDF</button>
                  <button className="btn-danger" onClick={()=>del(r)} disabled={deleting===r.id}>
                    {deleting===r.id?'…':'✕'}
                  </button>
                </div>
              </div>
            </div>
          );
        })
      }
    </div>
  );
}

// ─── IMPOSTAZIONI VIEW ─────────────────────────────────
function ImpostazioniView({ session, prestatore, onSave, toast }) {
  const [form, setForm] = useState({
    nome:prestatore?.nome||'', indirizzo:prestatore?.indirizzo||'',
    cf:prestatore?.cf||'', piva:prestatore?.piva||'',
  });
  const [saving, setSaving] = useState(false);
  const set = k => e => setForm(f=>({...f,[k]:e.target.value}));

  const handleSave = async () => {
    if(!form.nome) return;
    setSaving(true);
    const { error } = await sb.from('impostazioni').upsert(
      { user_id:session.user.id, nome:form.nome, indirizzo:form.indirizzo, cf:form.cf.toUpperCase(), piva:form.piva, updated_at:new Date().toISOString() },
      { onConflict:'user_id' }
    );
    if(error) toast('Errore: '+error.message);
    else { onSave(form); toast('✓ Dati salvati'); }
    setSaving(false);
  };

  const handleLogout = async () => {
    await sb.auth.signOut();
  };

  return (
    <div>
      <div className="page-title">
        Impostazioni
        {prestatore && <span className="settings-badge">✓ Configurato</span>}
      </div>
      <div className="card">
        <div className="user-email">Account: {session.user.email}</div>
        <div className="card-title">I tuoi dati — Prestatore</div>
        {!prestatore && <p style={{fontSize:'.85rem',color:'var(--mid)',marginBottom:16,lineHeight:1.6,background:'#f0ede6',padding:'10px 12px',borderRadius:3}}>
          Configura i tuoi dati una sola volta. Vengono salvati nel cloud e pre-compilati su ogni ricevuta.
        </p>}
        <div className="field"><label>Nome / Ragione Sociale *</label><input value={form.nome} onChange={set('nome')} placeholder="Mario Rossi" /></div>
        <div className="field"><label>Indirizzo</label><input value={form.indirizzo} onChange={set('indirizzo')} placeholder="Via Sardinia 1, 09100 Cagliari" /></div>
        <div className="field"><label>Codice Fiscale</label><input value={form.cf} onChange={e=>setForm(f=>({...f,cf:e.target.value.toUpperCase()}))} placeholder="RSSMRA80A01B354S" /></div>
        <div className="field"><label>Partita IVA (se presente)</label><input value={form.piva} onChange={set('piva')} placeholder="12345678901" /></div>
        <button className="btn-primary" onClick={handleSave} disabled={!form.nome||saving} style={{marginTop:18}}>
          {saving?'Salvataggio…': prestatore?'Salva modifiche':'Salva e inizia →'}
        </button>
        <div className="logout-row">
          <button className="btn-ghost" onClick={handleLogout}>Esci dall'account</button>
        </div>
      </div>
      <div className="card">
        <div className="card-title">Installa sul telefono</div>
        <ul className="install-steps">
          <li><span className="sn">1</span>Apri questa pagina su Safari (iPhone) o Chrome (Android)</li>
          <li><span className="sn">2</span><span>iPhone: <strong style={{color:'var(--black)'}}>📤 Condividi → Aggiungi alla schermata Home</strong></span></li>
          <li><span className="sn">2</span><span>Android: <strong style={{color:'var(--black)'}}>⋮ Menu → Aggiungi a schermata Home</strong></span></li>
          <li><span className="sn">3</span>L'icona Sugnu Rausana appare sulla home — apri come app</li>
        </ul>
      </div>
    </div>
  );
}

// ─── MAIN APP (autenticato) ─────────────────────────────
function MainApp({ session }) {
  const [prestatore, setPrestatore] = useState(null);
  const [ricevute, setRicevute] = useState([]);
  const [dataLoading, setDataLoading] = useState(true);
  const [view, setView] = useState(null); // null = wait for data
  const [toastState, setToastState] = useState({show:false,msg:''});

  const toast = msg => {
    setToastState({show:true,msg});
    setTimeout(()=>setToastState({show:false,msg:''}),2500);
  };

  const loadData = async () => {
    setDataLoading(true);
    try {
      const [{ data:imp }, { data:ric }] = await Promise.all([
        sb.from('impostazioni').select('*').maybeSingle(),
        sb.from('ricevute').select('*').order('created_at',{ascending:false}),
      ]);
      const pre = imp ? { nome:imp.nome, indirizzo:imp.indirizzo, cf:imp.cf, piva:imp.piva } : null;
      setPrestatore(pre);
      setRicevute((ric||[]).map(fromDB));
      setView(pre ? 'nuova' : 'impostazioni');
    } catch(e){ console.error(e); }
    setDataLoading(false);
  };

  useEffect(()=>{ loadData(); }, [session.user.id]);

  if(dataLoading) return <div className="loading-data">Caricamento dati…</div>;

  return (
    <>
      <nav className="nav">
        <div className="nav-logo">
          <img src={`data:image/jpeg;base64,${LOGO}`} alt="Sugnu Rausana" />
        </div>
        <div className="nav-tabs">
          {[['nuova','Nuova'],['storico','Storico'],['impostazioni','⚙']].map(([v,l])=>(
            <button key={v} className={'nav-tab'+(view===v?' active':'')} onClick={()=>setView(v)}>{l}</button>
          ))}
        </div>
      </nav>
      <div className="main">
        {view==='nuova' && prestatore &&
          <NuovaView prestatore={prestatore} ricevute={ricevute} onSaved={loadData} toast={toast} />}
        {view==='nuova' && !prestatore &&
          <ImpostazioniView session={session} prestatore={null} onSave={p=>{setPrestatore(p);loadData();}} toast={toast} />}
        {view==='storico' &&
          <StoricoView ricevute={ricevute} onDelete={loadData} toast={toast} />}
        {view==='impostazioni' &&
          <ImpostazioniView session={session} prestatore={prestatore} onSave={p=>{setPrestatore(p);setView('nuova');}} toast={toast} />}
      </div>
      <div className={'toast'+(toastState.show?' show':'')}>{toastState.msg}</div>
    </>
  );
}

// ─── ROOT APP ──────────────────────────────────────────
function App() {
  const [session, setSession] = useState(undefined); // undefined = loading

  useEffect(()=>{
    sb.auth.getSession().then(({ data:{ session } }) => setSession(session));
    const { data:{ subscription } } = sb.auth.onAuthStateChange((_,s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);

  if(session===undefined) return (
    <div className="loading-screen">
      <img src={`data:image/jpeg;base64,${LOGO}`} alt="Sugnu Rausana" />
    </div>
  );
  if(!session) return <LoginView />;
  return <MainApp session={session} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
